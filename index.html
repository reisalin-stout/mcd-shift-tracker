<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2933" />
    <title>Shift Tracker</title>
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <header class="top">
      <button id="menuBtn" aria-label="Open menu">&#9776;</button>
      <div>
        <div id="title"></div>
        <div id="subtitle"></div>
      </div>
      <div class="acct" id="acct">
        <button id="acctBtn" aria-haspopup="true" aria-expanded="false" aria-label="Account"></button>
        <div id="acctMenu" class="acct-menu" hidden></div>
      </div>
    </header>
    <div id="warn" hidden></div>
    <div id="overlay"></div>
    <nav id="drawer">
      <div class="grp" data-g="dayparts">
        <button class="grp-h" data-view="dayparts"><span>Dayparts</span><span class="chev">&rsaquo;</span></button>
        <div class="grp-b">
          <div id="dayparts"></div>
        </div>
      </div>
      <div class="grp" data-g="projection">
        <button class="grp-h" data-view="projection"><span>Projection</span><span class="chev">&rsaquo;</span></button>
        <div class="grp-b">
          <h3>Export</h3>
          <button class="menu-btn" id="expProj">Copy projection</button>
        </div>
      </div>
      <div class="grp leaf" data-g="extra">
        <button class="grp-h" data-view="extra"><span>Extra hours</span></button>
      </div>
      <div class="grp leaf" data-g="restock">
        <button class="grp-h" data-view="restock"><span>Restock</span></button>
      </div>
      <div class="drawer-foot">
        <div class="grp leaf" data-g="account">
          <button class="grp-h" data-view="account"><span id="acctDrawerLabel">Account</span></button>
        </div>
        <h3>Data</h3>
        <button class="menu-btn danger" id="clearData">Clear website data</button>
        <div id="ver"></div>
      </div>
    </nav>
    <main id="list"></main>
    <main id="proj" hidden>
      <div class="gc">
        <div class="gcf"><label for="gcInput">Guest Count Total</label><input id="gcInput" class="def" inputmode="decimal" autocomplete="off" /></div>
        <div class="gcf"><label for="gAdjInput">Adj %</label><input id="gAdjInput" class="def" inputmode="decimal" autocomplete="off" /></div>
      </div>
      <div class="ptable">
        <div class="prow phead">
          <div>Item</div>
          <div>Weight</div>
          <div>Yield</div>
          <div>Target</div>
          <div>Boxes</div>
        </div>
        <div id="pbody"></div>
      </div>
      <button class="copy-btn" id="projCopy">Copy projection</button>
    </main>
    <main id="extra" hidden></main>
    <main id="account" hidden></main>
    <main id="restock" hidden></main>
    <div id="restockExportModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="exportModalTitle">
      <div class="modal-overlay"></div>
      <div class="modal-box">
        <div class="modal-header">
          <h3 id="exportModalTitle">Export Restock List</h3>
          <button class="modal-close" aria-label="Close">&times;</button>
        </div>
        <div class="modal-content">
          <pre id="exportModalText" readonly></pre>
        </div>
        <div class="modal-footer">
          <button id="exportModalCopy" class="primary">Copy</button>
          <button id="exportModalClose" class="secondary">Close</button>
        </div>
      </div>
    </div>
    <div id="toast"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
