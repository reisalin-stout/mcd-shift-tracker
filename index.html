<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2933" />
    <title>Shift Tracker</title>
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <header class="top">
      <button id="menuBtn" aria-label="Open menu">&#9776;</button>
      <div>
        <div id="title"></div>
        <div id="subtitle"></div>
      </div>
    </header>
    <div id="warn" hidden></div>
    <div id="overlay"></div>
    <nav id="drawer">
      <div class="grp" data-g="dayparts">
        <button class="grp-h" data-view="dayparts"><span>Dayparts</span><span class="chev">&rsaquo;</span></button>
        <div class="grp-b">
          <div id="dayparts"></div>
          <h3>Export</h3>
          <button class="menu-btn" id="expTasks">Copy open tasks</button>
          <button class="menu-btn" id="expStock">Copy restock list</button>
        </div>
      </div>
      <div class="grp" data-g="projection">
        <button class="grp-h" data-view="projection"><span>Projection</span><span class="chev">&rsaquo;</span></button>
        <div class="grp-b">
          <h3>Export</h3>
          <button class="menu-btn" id="expProj">Copy projection</button>
        </div>
      </div>
      <div class="drawer-foot">
        <h3>Data</h3>
        <button class="menu-btn danger" id="clearData">Clear website data</button>
        <div id="ver"></div>
      </div>
    </nav>
    <main id="list"></main>
    <main id="proj" hidden>
      <div class="gc">
        <div class="gcf"><label for="gcInput">Guest Count Total</label><input id="gcInput" class="def" inputmode="decimal" autocomplete="off" /></div>
        <div class="gcf"><label for="gAdjInput">Adj %</label><input id="gAdjInput" class="def" inputmode="decimal" autocomplete="off" /></div>
      </div>
      <div class="ptable">
        <div class="prow phead">
          <div>Item</div>
          <div>Weight</div>
          <div>Yield</div>
          <div>Target</div>
          <div>Boxes</div>
        </div>
        <div id="pbody"></div>
      </div>
      <button class="copy-btn" id="projCopy">Copy projection</button>
    </main>
    <div id="toast"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
